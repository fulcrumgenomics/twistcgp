---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "civicpy_update_cache"

description: Downloads the CIViC nightly cache for use with civicpy annotation
keywords:
  - clinical interpretation
  - variant annotation
  - genomics
tools:
  - "civicpy":
      description: "CIViC variant knowledgebase analysis toolkit."
      homepage: "https://docs.civicpy.org/en/latest/"
      documentation: "https://docs.civicpy.org/en/latest/"
      tool_dev_url: "https://github.com/griffithlab/civicpy"
      doi: "10.1200/CCI.19.00127"
      licence: ["MIT"]
      identifier: biotools:CIViCpy

input: []

output:
  cache:
    - "civicpy_cache.pkl":
        type: file
        description: CIViC database cache file
        pattern: "*.pkl"

  versions_civicpy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - civicpy:
          type: string
          description: The name of the tool
      - civicpy --version | sed 's/.*version //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_civic_db:
    - - ${task.process}:
          type: string
          description: The name of the process
      - civic_db_release:
          type: string
          description: Provenance label for the CIViC knowledgebase snapshot date
      - cat civic_db_release.txt:
          type: eval
          description: The CIViC knowledgebase snapshot date (from the cache), or 'unknown'
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - civicpy:
          type: string
          description: The name of the tool
      - civicpy --version | sed 's/.*version //':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@emmcauley"
maintainers:
  - "@emmcauley"
