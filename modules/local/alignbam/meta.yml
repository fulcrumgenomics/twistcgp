---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "alignbam"
description: Aligns an unmapped BAM to a reference genome
keywords:
  - fgumi
  - fastq
  - zipper
  - sort
  - mem
  - bwa
  - bwa-mem3
  - alignment
  - map
  - bam
tools:
  - bwa:
      description: |
        bwa-mem3 is a short-read aligner derived from bwa-mem2 with correctness
        fixes, performance improvements, and methylation-aware alignment, for
        mapping DNA sequences against a large reference genome such as the human
        genome.
      homepage: https://github.com/fg-labs/bwa-mem3
      documentation: https://github.com/fg-labs/bwa-mem3
      arxiv: arXiv:1303.3997
      licence: ["MIT AND Apache-2.0"]
  - fgumi:
      description: High-performance UMI tools for NGS data analysis; `fgumi fastq` converts BAM to interleaved FASTQ and `fgumi zipper` merges mapped/unmapped BAMs and transfers tags.
      homepage: https://github.com/fulcrumgenomics/fgumi
      documentation: https://github.com/fulcrumgenomics/fgumi
      tool_dev_url: https://github.com/fulcrumgenomics/fgumi
      licence: ["MIT"]
  - mako:
      description: A fast SAM/BAM sorter (part of the fg-mako package), used here to coordinate-sort the zippered BAM.
      homepage: https://github.com/fulcrumgenomics/mako
      documentation: https://github.com/fulcrumgenomics/mako
      tool_dev_url: https://github.com/fulcrumgenomics/mako
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - unmapped_bam:
        type: file
        description: the unmapped BAM/SAM/CRAM file.
        pattern: "*.{bam,cram,sam}"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: FASTA reference file
        pattern: "*.{fasta,fa}"
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference genome meta information
          e.g. [ id:'test' ]
    - fasta_fai:
        type: file
        description: FASTA reference index file
        pattern: "*.fai"
  - - meta4:
        type: map
        description: |
          Groovy Map containing reference genome meta information
          e.g. [ id:'test' ]
    - dict:
        type: file
        description: Reference sequence dictionary
        pattern: ".dict file containing reference sequence dictionary"
  - - meta5:
        type: map
        description: |
          Groovy Map containing reference genome meta information
          e.g. [ id:'test' ]
    - bwa_dir:
        type: file
        description: BWA genome index files
        pattern: "Directory containing BWA index *.{amb,ann,bwt,pac,sa}"
  - - sort_type:
        type: string
        description: True to sort the output in template-coordinate order, otherwise don't sort
        pattern: "{none,template-coordinate,coordinate}"

output:
  - bam:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.bam":
          type: file
          description: Optionally sorted aligned BAM file
          pattern: "*.bam"
  - bai:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.bai":
          type: file
          description: Optional BAI file output if sort_type == coordinate
          pattern: "*.{bai}"
  - bam_bai:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.mapped.bam":
          type: file
          description: Sorted aligned BAM, emitted together with its index when sort_type == coordinate
          pattern: "*.mapped.bam"
      - "*.mapped.bam.bai":
          type: file
          description: BAI index emitted alongside the BAM when sort_type == coordinate
          pattern: "*.mapped.bam.bai"
  - versions_bwamem3:
      - - "${task.process}":
            type: string
            description: The name of the process
        - "bwamem3":
            type: string
            description: The name of the tool
        - "bwa-mem3 version | sed -nE '1 s/^([0-9]+(\\.[0-9]+)+).*/\\1/p'":
            type: eval
            description: The expression to obtain the version of the tool
  - versions_fgumi:
      - - "${task.process}":
            type: string
            description: The name of the process
        - "fgumi":
            type: string
            description: The name of the tool
        - "fgumi --version | sed 's/^fgumi //'":
            type: eval
            description: The expression to obtain the version of the tool
  - versions_mako:
      - - "${task.process}":
            type: string
            description: The name of the process
        - "mako":
            type: string
            description: The name of the tool
        - "mako --version | sed '1!d; s/^[^ ]* //; s/ .*//'":
            type: eval
            description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "bwamem3":
          type: string
          description: The name of the tool
      - "bwa-mem3 version | sed -nE '1 s/^([0-9]+(\\.[0-9]+)+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "fgumi":
          type: string
          description: The name of the tool
      - "fgumi --version | sed 's/^fgumi //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - "${task.process}":
          type: string
          description: The name of the process
      - "mako":
          type: string
          description: The name of the tool
      - "mako --version | sed '1!d; s/^[^ ]* //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@znorgaard"
maintainers:
  - "@znorgaard"
