---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - bioconda::bwa-mem2=2.2.1
  - bioconda::fgbio=2.5.21
  # find is used to locate the bwa index prefix; provided as a conda package so it is present in
  # the conda-env-only Wave Singularity image (which has no base OS), not just the Docker image.
  - conda-forge::findutils=4.10.0
  - bioconda::samtools=1.21
