---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - bioconda::bwa-mem3=0.8.0
  - bioconda::fgumi=0.5.0
  - bioconda::fg-mako=0.1.3
  # The micromamba amazon2023 base image Wave builds on is minimal and lacks
  # findutils/coreutils; the alignbam script needs `find` and the coreutils
  # used in the versions block, so pull them in explicitly.
  - conda-forge::findutils=4.10.0
  - conda-forge::coreutils=9.5
