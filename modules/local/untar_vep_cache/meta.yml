---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "untar_vep_cache"

description: Extracts a gzip-compressed VEP cache tarball into a directory suitable for use with Ensembl VEP.
keywords:
  - vep
  - cache
  - annotation
  - untar

tools:
  - "tar":
      description: "GNU tar archiving utility."
      homepage: "https://www.gnu.org/software/tar/"
      documentation: "https://www.gnu.org/software/tar/manual/"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing cache information
          e.g. [ id:'vep_cache' ]
    - archive:
        type: file
        description: Gzip-compressed VEP cache tarball (.tar.gz)
        pattern: "*.tar.gz"

output:
  cache:
    - - meta:
          type: map
          description: |
            Groovy Map containing cache information
            e.g. [ id:'vep_cache' ]
      - "${prefix}":
          type: directory
          description: |
            Extracted VEP cache directory. VEP requires the species/ subdirectory
            to be present directly under this root (hence we do not use --strip-components).

  versions_yml:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"

authors:
  - "@emmcauley"
maintainers:
  - "@emmcauley"
